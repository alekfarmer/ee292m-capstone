line-length = 100
target-version = "py314"

[lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "S", "D", "ANN"]
ignore = [
    "D203", "D213",   # use D211 / D212 docstring layout
    "S101",           # assert is how pytest checks
]

[lint.per-file-ignores]
"tests/**" = ["D", "ANN", "S"]

[lint.pydocstyle]
convention = "google"
