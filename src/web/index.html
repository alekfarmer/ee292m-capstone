<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>C to Gates</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="title">
      <h1>C to Gates</h1>
      <p class="lede">One C program on a single-cycle RV32I core: every value below is the
        verified gate-level simulation in that cycle.</p>
    </div>
    <nav class="stepper" aria-label="Step through the program">
      <button type="button" id="first" title="First cycle (Home)">|◀</button>
      <button type="button" id="prev-line" title="Previous C line (↑)">◀ line</button>
      <button type="button" id="prev" title="Previous cycle (←)">◀ cycle</button>
      <button type="button" id="play" title="Play / pause (space)" aria-pressed="false">▶ play</button>
      <button type="button" id="next" title="Next cycle (→)">cycle ▶</button>
      <button type="button" id="next-line" title="Next C line (↓)">line ▶</button>
      <button type="button" id="last" title="Last cycle (End)">▶|</button>
      <label class="slider">
        <span id="cycle-label">cycle 0</span>
        <input type="range" id="cycle" min="0" max="0" value="0" aria-label="Cycle">
      </label>
      <label class="speed">speed
        <select id="speed" aria-label="Play speed">
          <option value="1000">1 / s</option>
          <option value="500" selected>2 / s</option>
          <option value="200">5 / s</option>
        </select>
      </label>
    </nav>
  </header>

  <p id="error" class="error" role="alert" hidden></p>

  <main>
    <section class="pane" aria-labelledby="c-title">
      <h2 id="c-title">C source <span id="c-file" class="muted"></span></h2>
      <ol id="c-lines" class="code c-code"></ol>
    </section>

    <section class="pane" aria-labelledby="asm-title">
      <h2 id="asm-title">Assembly <span class="muted">RV32I, real instructions</span></h2>
      <div class="code-scroll">
        <table id="asm" class="code asm"></table>
      </div>
    </section>

    <section class="pane binary-pane" aria-labelledby="bin-title">
      <h2 id="bin-title">Machine code</h2>
      <p id="insn-summary" class="summary"></p>
      <div id="fields" class="fields"></div>
      <p id="effect" class="summary"></p>
    </section>

    <section class="pane hw-pane" aria-labelledby="hw-title">
      <div class="hw-head">
        <h2 id="hw-title">Hardware</h2>
        <nav id="crumbs" class="crumbs" aria-label="Module path"></nav>
        <span id="view-info" class="muted"></span>
        <label class="fit"><input type="checkbox" id="show-changed" checked> highlight changes</label>
        <label class="fit"><input type="checkbox" id="fit"> fit to width</label>
      </div>
      <div class="legend">
        <span><i class="sw one"></i>1</span>
        <span><i class="sw zero"></i>0</span>
        <span><i class="sw bus"></i>bus (value on the wire)</span>
        <span><i class="sw changed"></i>changed this cycle</span>
        <span>click a block marked ⤢ to open it</span>
      </div>
      <div id="view" class="view" tabindex="0" aria-label="Module drawing"></div>
    </section>
  </main>

  <script src="/vendor/elkjs/lib/elk.bundled.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
