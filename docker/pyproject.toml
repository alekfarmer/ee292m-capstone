[project]
name = "c-to-gates"
version = "0.1.0"
description = "Backend for the C-to-gates RISC-V visualization"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.28",   # FastAPI TestClient
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
package = false
